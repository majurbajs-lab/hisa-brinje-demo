<!doctype html>
<html lang="sl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Na Kluk' · Govejk pri Idriji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prenočišča Na Kluk' v vasi Govejk, 10 minut vožnje od Idrije. Predlog strani.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: photo-led editorial page */
:root{
  --paper:#f7f7f3;       
  --paper-2:#eceee7;
  --ink:#1c2b27;         /* spruce shadow */
  --ink-2:#4d5c57;
  --moss:#3f6b4f;        /* accent */
  --moss-ink:#ffffff;
  --wood:#9a6a3a;        /* larch, used only for small marks */
  --rule:#d6dbd2;
  --ph-a:#c9d3cb; --ph-b:#aebdb2;
  --display:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a18;--paper-2:#1b2320;--ink:#e8ece6;--ink-2:#a9b5ae;--moss:#8fbf9c;--moss-ink:#10241a;--wood:#cf9a63;--rule:#2c3632;--ph-a:#26322d;--ph-b:#31403a;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a18;--paper-2:#1b2320;--ink:#e8ece6;--ink-2:#a9b5ae;--moss:#8fbf9c;--moss-ink:#10241a;--wood:#cf9a63;--rule:#2c3632;--ph-a:#26322d;--ph-b:#31403a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.g{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(2rem,4.4vw,3.2rem)}
h3{font-size:clamp(1.6rem,3vw,2.1rem)}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:.5em;border:0;border-radius:2px;padding:.85em 1.35em;font:500 .95rem var(--body);cursor:pointer;text-decoration:none;background:var(--moss);color:var(--moss-ink)}
.btn.line{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.demo-note{font-size:.8rem;text-align:center;padding:6px 16px;background:var(--ink);color:var(--paper)}

/* photo slots */
.ph{position:relative;background:linear-gradient(135deg,var(--ph-a),var(--ph-b));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.empty::after{content:attr(data-cap);position:absolute;left:12px;bottom:10px;right:12px;font:italic .9rem var(--display);color:var(--ink-2)}

/* hero */
.hero{position:relative;min-height:min(88vh,820px);display:grid;align-items:end;color:#fff;isolation:isolate}
.hero .ph{position:absolute;inset:0;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,20,16,.45) 0%,rgba(10,20,16,0) 28%,rgba(10,20,16,0) 50%,rgba(10,20,16,.62) 100%)}
.hero.noimg{color:var(--ink)}
.hero.noimg::before{display:none}
.topbar{position:absolute;top:0;left:0;right:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.topbar .g{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.mark{font-family:var(--display);font-size:1.35rem;text-decoration:none}
nav.links{display:flex;gap:22px;font-size:.92rem}
nav.links a{text-decoration:none;opacity:.92}
nav.links a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.lang{display:flex;gap:2px;font-size:.8rem}
.lang button{background:none;border:0;color:inherit;font:500 .8rem var(--body);padding:4px 6px;cursor:pointer;opacity:.7;letter-spacing:.08em}
.lang button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:4px}
.hero-copy{padding-block:0 clamp(28px,6vh,64px);display:grid;gap:18px;max-width:720px}
.hero h1{font-size:clamp(3.2rem,9vw,6.6rem);line-height:.95}
.hero .sub{font-size:1.12rem;max-width:34em}
.hero:not(.noimg) .eyebrow{color:rgba(255,255,255,.92)}
.hero:not(.noimg) .hero-copy{text-shadow:0 1px 14px rgba(0,0,0,.45)}
.hero .btn.line{color:inherit}
@media (max-width:760px){nav.links{display:none}}

/* host intro */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,6vw,90px);padding-block:clamp(56px,9vw,120px);align-items:start}
.intro .lead{font-family:var(--display);font-size:clamp(1.45rem,2.6vw,1.95rem);line-height:1.35}
.intro .body{display:grid;gap:14px;color:var(--ink-2);max-width:34em}
.sig{font-family:var(--display);font-style:italic;font-size:1.3rem;color:var(--ink)}
.intro .ph{aspect-ratio:4/5}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts div{padding:18px 16px 18px 0;display:grid;gap:2px}
.facts b{font-family:var(--display);font-weight:400;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.facts span{font-size:.88rem;color:var(--ink-2)}
@media (max-width:760px){.intro{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(-n+2){border-bottom:1px solid var(--rule)}}

/* units */
section.block{padding-block:clamp(56px,8vw,110px)}
.head{display:grid;gap:10px;margin-bottom:clamp(28px,4vw,48px);max-width:640px}
.head p{color:var(--ink-2)}
.unit{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.unit + .unit{margin-top:clamp(56px,8vw,96px)}
.unit.flip .pics{order:2}
.pics{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;aspect-ratio:3/2}
.pics > :first-child{grid-row:1/3}
.pics button .ph{width:100%;height:100%}
.pics button{all:unset;cursor:zoom-in;display:block}
.pics button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.utext{display:grid;gap:16px;padding-top:6px}
.utext .story{color:var(--ink-2)}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:.95rem}
dl.spec dt{color:var(--ink-2)}
dl.spec dd{margin:0}
.from{font-family:var(--display);font-size:1.4rem}
.from small{font-family:var(--body);font-size:.85rem;color:var(--ink-2)}
@media (max-width:760px){.unit,.unit.flip{grid-template-columns:1fr}.unit.flip .pics{order:0}}

/* gallery strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,32%);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.strip .ph{aspect-ratio:4/5;scroll-snap-align:start}
.strip button{all:unset;cursor:zoom-in;display:block}

/* seasons */
.seasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,4vw,48px)}
.season{display:grid;gap:14px}
.season .ph{aspect-ratio:16/10}
.season ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.season li{padding-left:18px;position:relative;color:var(--ink-2)}
.season li::before{content:"";position:absolute;left:0;top:.75em;width:8px;height:1px;background:var(--wood)}
@media (max-width:760px){.seasons{grid-template-columns:1fr}}

/* area map */
.area{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
.map{background:var(--paper-2);border-radius:2px;overflow-x:auto}
.map svg{display:block;width:100%;min-width:520px;height:auto}
.map text{font-family:var(--body);font-size:13px;fill:var(--ink-2)}
.map .big{font-family:var(--display);font-size:18px;font-style:italic;fill:var(--ink)}
.dist{margin:0;padding:0;list-style:none}
.dist li{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.dist b{font-family:var(--display);font-weight:400;font-size:1.25rem;font-variant-numeric:tabular-nums}
@media (max-width:760px){.area{grid-template-columns:1fr}}

/* prices */
.tablebox{overflow-x:auto}
table.prices{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.prices th,table.prices td{text-align:left;padding:14px 18px 14px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
table.prices th{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
table.prices td.n{font-family:var(--display);font-size:1.25rem}
.pnote{color:var(--ink-2);font-size:.92rem;margin-top:14px;max-width:46em}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 40px;margin-top:40px}
.know p{padding:14px 0;border-top:1px solid var(--rule);color:var(--ink-2)}
.know b{color:var(--ink);font-weight:500}

/* inquiry */
.inq-wrap > *{align-self:start;align-content:start}
.inq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,72px)}
form.inq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
form.inq label{display:grid;gap:6px;font-size:.85rem;color:var(--ink-2)}
form.inq .full{grid-column:1/-1}
input,select,textarea{font:1rem var(--body);padding:11px 0;border:0;border-bottom:1px solid var(--ink-2);background:transparent;color:var(--ink);width:100%;min-width:0;border-radius:0}
select{padding-right:8px}
textarea{min-height:86px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--moss);box-shadow:0 1px 0 var(--moss)}
.consent{display:flex!important;gap:10px;align-items:flex-start;font-size:.88rem}
.consent input{width:auto;margin-top:5px}
.out{grid-column:1/-1;background:var(--paper-2);padding:14px 16px;display:grid;gap:10px;font-size:.95rem}
.out pre{white-space:pre-wrap;margin:0;font:.88rem/1.5 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:760px){.inq-wrap,form.inq{grid-template-columns:1fr}}

footer{border-top:1px solid var(--rule);padding-block:36px 120px;font-size:.88rem;color:var(--ink-2)}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
footer b{color:var(--ink);font-weight:500}

/* sticky price bar (phones) */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--rule);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:none;justify-content:space-between;align-items:center;gap:12px}
.bar span{font-family:var(--display);font-size:1.15rem}
@media (max-width:760px){.bar{display:flex}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:40;background:rgba(8,12,10,.92);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:82vh;width:auto;max-width:100%}
.lb p{color:#e8ece6;font:italic 1rem var(--display);margin-top:10px;text-align:center}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;padding:10px}
.lb .x{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
.lb .pv{left:calc(4px + env(safe-area-inset-left,0px));top:50%}
.lb .nx{right:calc(4px + env(safe-area-inset-right,0px));top:50%}

/* guest helper */
.ask{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 18px 8px 8px;font:500 .95rem var(--body);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.ask .av{width:34px;height:34px;border-radius:50%;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;font:italic 1.1rem var(--display)}
@media (max-width:760px){.ask{bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
.chat{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;width:min(390px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));background:var(--paper);border:1px solid var(--rule);box-shadow:0 18px 48px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;border-radius:6px}
@media (max-width:760px){.chat{right:0;left:0;bottom:0;width:auto;height:calc(100% - 40px - env(safe-area-inset-top,0px));border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.chat header{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.chat header .av{width:40px;height:40px;border-radius:50%;background:var(--moss);color:var(--moss-ink);display:grid;place-items:center;font:italic 1.3rem var(--display);flex:none}
.chat header div{flex:1;min-width:0}
.chat header b{font-family:var(--display);font-weight:400;font-size:1.2rem;display:block;line-height:1.2}
.chat header small{color:var(--ink-2);font-size:.78rem}
.chat .x{background:none;border:0;color:var(--ink-2);font-size:1.6rem;cursor:pointer;line-height:1}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;font-size:.95rem;line-height:1.5;white-space:pre-line}
.m.bot{align-self:flex-start}
.m.bot .txt{background:var(--paper-2);padding:10px 13px;border-radius:2px 14px 14px 14px}
.m.me{align-self:flex-end;background:var(--moss);color:var(--moss-ink);padding:9px 13px;border-radius:14px 2px 14px 14px}
.m .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m .acts button{background:none;border:1px solid var(--moss);color:var(--moss);border-radius:999px;padding:5px 12px;font:500 .82rem var(--body);cursor:pointer}
.quote{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.quote div{display:flex;justify-content:space-between;gap:12px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--paper-2);border-radius:2px 14px 14px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);opacity:.4}
@media (prefers-reduced-motion:no-preference){.typing i{animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:1}}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
.chips button{flex:none;background:var(--paper-2);border:0;color:var(--ink);border-radius:999px;padding:7px 12px;font:.84rem var(--body);cursor:pointer}
.chat form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--rule)}
.chat form input{border:1px solid var(--rule);border-radius:999px;padding:10px 14px;background:var(--paper)}
.chat form button{background:var(--moss);color:var(--moss-ink);border:0;border-radius:999px;padding:0 16px;font:500 .9rem var(--body);cursor:pointer}
.ainote{font-size:.72rem;color:var(--ink-2);padding:0 16px 8px}
.ask,.chat{display:none!important}
</style>
</head>
<body>

<div class="demo-note" data-t="demo"></div>

<header class="hero" id="top">
  <div class="ph" data-img="hero"></div>
  <div class="topbar"><div class="g">
    <a class="mark" href="#top" data-c="name"></a>
    <nav class="links" aria-label="Navigacija">
      <a href="#apartmaji" data-t="navUnits"></a><a href="#okolica" data-t="navArea"></a><a href="#cene" data-t="navPrices"></a><a href="#povprasevanje" data-t="navInq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Jezik / Language"><button type="button" data-lang="sl">SL</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button></div>
  </div></div>
  <div class="g"><div class="hero-copy">
    <p class="eyebrow" data-c="place"></p>
    <h1 data-c="name"></h1>
    <p class="sub" data-c="tagline"></p>
    <div><a class="btn" href="#povprasevanje" data-t="ctaCheck"></a></div>
  </div></div>
</header>

<main>
  <div class="g">
    <section class="intro">
      <div style="display:grid;gap:22px">
        <p class="lead" data-c="hostLead"></p>
        <div class="body" id="hostBody"></div>
        <p class="sig" data-c="hostSig"></p>
      </div>
      <div class="ph" data-img="hosts"></div>
    </section>
    <div class="facts" id="facts"></div>
  </div>

  <section class="block" id="apartmaji"><div class="g">
    <div class="head"><p class="eyebrow" data-t="unitsEyebrow"></p><h2 data-t="unitsTitle"></h2></div>
    <div id="units"></div>
  </div></section>

  <section class="block" style="padding-top:0"><div class="g">
    <div class="strip" id="strip" aria-label="Galerija"></div>
  </div></section>

  <section class="block" style="background:var(--paper-2)"><div class="g">
    <div class="head"><p class="eyebrow" data-t="seasonEyebrow"></p><h2 data-t="seasonTitle"></h2></div>
    <div class="seasons" id="seasons"></div>
  </div></section>

  <section class="block" id="okolica"><div class="g">
    <div class="head"><p class="eyebrow" data-t="areaEyebrow"></p><h2 data-t="areaTitle"></h2><p data-c="areaIntro"></p></div>
    <div class="area">
      <div class="map" id="map"></div>
      <ul class="dist" id="dist"></ul>
    </div>
  </div></section>

  <section class="block" id="cene" style="padding-top:0"><div class="g">
    <div class="head"><p class="eyebrow" data-t="pricesEyebrow"></p><h2 data-t="pricesTitle"></h2></div>
    <div class="tablebox" hidden><table class="prices" id="prices"></table></div>
    <p class="pnote" id="pnote"></p>
    <div class="know" id="know"></div>
  </div></section>

  <section class="block" id="povprasevanje" style="background:var(--paper-2)"><div class="g inq-wrap">
    <div class="head" style="margin:0"><p class="eyebrow" data-t="inqEyebrow"></p><h2 data-t="inqTitle"></h2><p data-t="inqSub"></p></div>
    <form class="inq" id="inq" novalidate>
      <label><span data-t="fName"></span><input id="fName" autocomplete="name"></label>
      <label><span data-t="fEmail"></span><input id="fEmail" type="email" autocomplete="email"></label>
      <label><span data-t="fFrom"></span><input id="fFrom" type="date"></label>
      <label><span data-t="fTo"></span><input id="fTo" type="date"></label>
      <label><span data-t="fUnit"></span><select id="fUnit"></select></label>
      <label><span data-t="fGuests"></span><input id="fGuests" type="number" min="1" max="8" value="2"></label>
      <label class="full"><span data-t="fMsg"></span><textarea id="fMsg"></textarea></label>
      <label class="full consent"><input id="fConsent" type="checkbox"><span data-t="fConsent"></span></label>
      <div class="full"><button class="btn" type="submit" data-t="fSend"></button></div>
      <div class="out" id="inqOut" hidden></div>
    </form>
  </div></section>
</main>

<footer><div class="g cols">
  <div><b data-c="name"></b><br><span data-c="place"></span><br><span id="contact"></span></div>
  <div id="legal"></div>
  <div><b data-t="privTitle"></b><br><span data-t="privText"></span></div>
</div></footer>

<div class="bar"><span id="barPrice"></span><a class="btn" href="#povprasevanje" data-t="ctaCheck"></a></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Fotografija">
  <button class="x" type="button" id="lbX" aria-label="Zapri">×</button>

  var r = {}; var n = norm(q);
  // 12.7. - 15.7. / 12/7 to 15/7 / 12. 7. do 15. 7.
  var nums = []; var re = /(\d{1,2})\s*[.\/]\s*(\d{1,2})\.?/g, mm;
  while ((mm = re.exec(n))) nums.push([+mm[1], +mm[2]]);
  if (nums.length >= 2){ r.from = mkDate(nums[0][0], nums[0][1]); r.to = mkDate(nums[1][0], nums[1][1]); if (r.from && r.to && r.to <= r.from) r.to = new Date(Date.UTC(r.from.getUTCFullYear() + (nums[1][1] < nums[0][1] ? 1 : 0), nums[1][1] - 1, nums[1][0])); }
  else {
    // 12-15 july / 12. do 15. julija / 28 jul - 2 aug
    var w = n.split(/\s+/), ds = [], ms = [];
    w.forEach(function(x, i){ var d = x.match(/^(\d{1,2})\.?$/); var range = x.match(/^(\d{1,2})\.?-(\d{1,2})\.?$/); var mo = monthOf(x);
      if (range){ ds.push(+range[1], +range[2]); } else if (d && +d[1] <= 31 && !/^(oseb|osebe|osebi|people|persons|guests|personen|noci|nocitve|nights|nachte|odrasl|adults|erwachs)/.test(w[i+1] || "")) ds.push(+d[1]); else if (mo) ms.push({m: mo, at: ds.length}); });
    if (ds.length >= 2 && ms.length){
      var m1 = ms[0].at >= 2 ? ms[0].m : ms[0].m, m2 = ms.length > 1 ? ms[1].m : ms[0].m;
      if (ms.length > 1 && ms[0].at === 1) { m1 = ms[0].m; }
      r.from = mkDate(ds[0], m1); r.to = mkDate(ds[1], m2);
      if (r.from && r.to && r.to <= r.from && m1 === m2) r.to = null;
    }
  }
  var g = n.match(/(\d{1,2})\s*(oseb|osebe|osebi|odrasl|ljudi|people|persons|guests|adults|of us|personen|erwachsene|leute)/);
  if (g) r.guests = +g[1];
  else if (/\b(dva|dve|two|zwei|par|couple|paar)\b/.test(n) && /(oseb|odrasl|people|guests|personen|par|couple|paar|nas|us|wir)/.test(n)) r.guests = 2;
  var nn = n.match(/(\d{1,2})\s*(noci|nocitve|nights|nachte|nacht)/); if (nn) r.nights = +nn[1];
  if (/enoposteljn|single|einzel/.test(n)) r.unit = "enoposteljna"; if (/druzin|family|familie/.test(n)) r.unit = "druzinska";
  r.priceIntent = /(cena|cene|kolik|stane|price|cost|how much|rate|preis|kosten|wieviel|was kostet|prost|termin|available|availability|frei|verfugbar|book|rezerv|buchen)/.test(n);
  r.mailIntent = /(pisi|piši|napis|kontakt|gostitelj|host|contact|email|e-mail|schreib|gastgeber)/.test(n);
  return r;
}
function seasonPrice(d, unit){ var m = d.getUTCMonth() + 1; var s = S.seasonsPrice.filter(function(x){ return x.months.indexOf(m) >= 0; })[0]; return s[unit]; }
function fmt(d){ return d.getUTCDate() + ". " + T[lang].months[d.getUTCMonth()]; }
function quote(){
  var nights = Math.round((ctx.to - ctx.from) / 86400000);
  var g = ctx.guests || 2;
  var box = el("div", "quote");
  var units = S.units.filter(function(u){ return (!ctx.unit || u.id === ctx.unit) && u.guests >= g; });
  if (!units.length) units = S.units.filter(function(u){ return u.guests >= g; });
  var head = t("quoteHead", {d1: fmt(ctx.from), d2: fmt(ctx.to), n: nights, g: g, gw: g === 1 ? t("guest1") : t("guestN")});
  if (g > 5) return {text: t("tooManyAll")};
  var lines = [];
  units.forEach(function(u){
    var sum = 0; for (var i = 0; i < nights; i++) sum += seasonPrice(new Date(ctx.from.getTime() + i * 86400000), u.id);
    var disc = Math.round(sum * (1 - S.directDiscount) * 100) / 100;
    var row = el("div"); row.appendChild(el("span", null, c(u.name) + " (" + t("quoteDirect") + ")")); row.appendChild(el("b", null, money(disc))); box.appendChild(row);
    lines.push(c(u.name) + ": " + money(disc));
  });
  var tax = Math.round(S.tax * g * nights * 100) / 100;
  var tr = el("div"); tr.appendChild(el("span", null, t("quoteTax"))); tr.appendChild(el("span", null, money(tax))); box.appendChild(tr);
  var extra = nights < S.minNights ? " " + t("minN", {n: S.minNights}) : "";
  if (g > 2 && !ctx.unit) extra += " " + t("tooMany", {g: g});
  return {text: head + extra, box: box, note: t("quoteNote")};
}
function fillForm(note){
  if (ctx.from) document.getElementById("fFrom").value = ctx.from.toISOString().slice(0, 10);
  if (ctx.to) document.getElementById("fTo").value = ctx.to.toISOString().slice(0, 10);
  if (ctx.guests) document.getElementById("fGuests").value = ctx.guests;
  var unit = ctx.unit || (ctx.guests > 4 ? "druzinska" : null); if (unit) document.getElementById("fUnit").value = unit;
  if (typeof note === "string" && note && !val("fMsg")) document.getElementById("fMsg").value = note;
  if (matchMedia("(max-width:760px)").matches) closeChat();
  document.getElementById("povprasevanje").scrollIntoView();
  setTimeout(function(){ document.getElementById("fName").focus({preventScroll: true}); }, 400);
}
function faqMatches(q){
  var words = norm(q).split(/\s+/).filter(function(w){ return w.length >= 3; });
  var scored = S.faq.map(function(f){
    var keys = f.k.split(" "), s = 0;
    words.forEach(function(w){ keys.forEach(function(k){ if (w === k || (w.length >= 4 && k.length >= 4 && (w.indexOf(k) === 0 || k.indexOf(w) === 0))) s++; }); });
    return {f: f, s: s};
  }).filter(function(x){ return x.s > 0; }).sort(function(a, b){ return b.s - a.s; });
  return scored.slice(0, 2).filter(function(x, i, a){ return i === 0 || x.s >= a[0].s; }).map(function(x){ return x.f; });
}
var fillAct = function(){ return [t("fill"), function(){ fillForm(); }]; };
function localReply(q, forced){
  var p = parse(q);
  if (p.from) ctx.from = p.from; if (p.to) ctx.to = p.to; if (p.guests) ctx.guests = p.guests; if (p.unit) ctx.unit = p.unit;
  if (p.from && !p.to && p.nights) ctx.to = new Date(p.from.getTime() + p.nights * 86400000);
  if (forced === "mail" || (p.mailIntent && !p.priceIntent)){ fillForm(); return {text: t("mailHint")}; }
  var hasDates = ctx.from && ctx.to && ctx.to > ctx.from;
  if (p.from && ctx.from < new Date(Date.now() - 86400000)) return {text: t("past")};
  if (!S.seasonsPrice.length && (forced === "price" || p.priceIntent || p.from)) return {text: t("fallback"), acts: [[t("mail"), function(){ fillForm(q); }]]};
  if (forced === "price" || p.priceIntent || p.from){
    if (!hasDates) return {text: t("askDates")};
    var qt = quote(); return {text: qt.text, box: qt.box, note: qt.note, acts: [fillAct()]};
  }
  if (p.guests && hasDates){ var q2 = quote(); return {text: q2.text, box: q2.box, note: q2.note, acts: [fillAct()]}; }
  var m = faqMatches(q);
  if (m.length) return {text: m.map(function(f){ return c(f.a); }).join("\n\n")};
  return {text: t("fallback"), acts: [[t("mail"), function(){ fillForm(q); }]]};
}
function ask(q, forced){
  q = (q || "").trim(); if (!q) return;
  var dl = detectLang(q); if (dl && dl !== lang && !forced){ lang = dl; try { localStorage.setItem("lang", lang); } catch(e) {} render(); }
  me(q); hist.push({role: "user", content: q});
  var w = typing();
  var finish = function(r){
    w.remove();
    var extra = null;
    if (r.box){ extra = r.box; if (r.note){ var n = el("div"); n.style.marginTop = "6px"; n.style.color = "var(--ink-2)"; n.textContent = r.note; extra.appendChild(n); } }
    bot(r.text, extra, r.acts); hist.push({role: "assistant", content: r.text});
  };
  var local = localReply(q, forced);
  var useAi = S.aiEndpoint && !local.box && local.text === t("fallback");
  if (useAi){
    fetch(S.aiEndpoint, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({lang: lang, messages: hist.slice(-10)})})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(d){ finish({text: d.answer, acts: [[t("mail"), fillForm]]}); })
      .catch(function(){ finish(local); });
  } else setTimeout(function(){ finish(local); }, 450 + Math.min(700, local.text.length * 4));
}
document.getElementById("chatForm").addEventListener("submit", function(e){ e.preventDefault(); var i = document.getElementById("chatIn"); ask(i.value); i.value = ""; });

render();
})();
